services:

  postgres:
    image: postgres:18
    container_name: smartdeliveryops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: smartdeliveryops
      POSTGRES_USER: smartdelivery
      POSTGRES_PASSWORD: [REDACTED-OLD-DB-PASSWORD]

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    image: smartdeliveryops-backend:latest
    container_name: smartdeliveryops-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://smartdelivery:[REDACTED-OLD-DB-PASSWORD]@postgres:5432/smartdeliveryops

    ports:
      - "8001:8001"

    depends_on:
      - postgres

volumes:
  postgres_data:
