apiVersion: apps/v1
kind: Deployment

metadata:
  name: ai-model

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-model

  template:
    metadata:
      labels:
        app: ai-model

    spec:
      containers:
        - name: ai-model

          image: 192.168.49.2:5000/smartdeliveryops-ai-model:day14

          imagePullPolicy: Always

          ports:
            - containerPort: 8003

          env:
            - name: OLLAMA_URL
              value: "http://192.168.49.1:11434"

            - name: OLLAMA_MODEL
              value: "qwen2.5:0.5b"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

---

apiVersion: v1
kind: Service

metadata:
  name: ai-model-service

spec:
  selector:
    app: ai-model

  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003

  type: ClusterIP
