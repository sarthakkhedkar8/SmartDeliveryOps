apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-prediction
  labels:
    app: ai-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-prediction
  template:
    metadata:
      labels:
        app: ai-prediction
    spec:
      containers:
        - name: ai-prediction
          image: 192.168.49.2:5000/smartdeliveryops-ai-prediction:build-8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-prediction-service
spec:
  selector:
    app: ai-prediction
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP
